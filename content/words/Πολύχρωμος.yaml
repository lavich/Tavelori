id: w22-31
greek: Πολύχρωμος
russian: разноцветный
ipa: "/poˈlixromos/"
verified: true
source: "Набор класса LEEKE A2 — 26-27; фонетика, примеры и иллюстрации подготовлены Lexi."
image: colorful.svg
reading:
  - text: "ύ"
    ipa: "i"
    explanation: "υ читается как и, а не как русское у"
  - text: "χρ"
    ipa: "xr"
    explanation: "χ перед α, ο, υ и согласной — глухой х, как в «хор»"
  - text: "ω"
    ipa: "o"
    explanation: "ω читается точно так же, как ο"
examples:
  - greek: "Ο παπαγάλος είναι πολύχρωμος."
    russian: "Попугай разноцветный."
    target: "πολύχρωμος"
