id: w14-17
greek: το τηλέφωνο
russian: телефон
ipa: "/to tiˈlefono/"
verified: true
source: "Набор класса LEEKE A2 — 26-27; фонетика, примеры и иллюстрации подготовлены Lexi."
image: phone.svg
reading:
  - text: "η"
    ipa: "i"
    explanation: "η читается как и — в греческом несколько букв для звука и"
  - text: "φ"
    ipa: "f"
    explanation: "φ — один звук ф, писать два знака не нужно"
  - text: "ω"
    ipa: "o"
    explanation: "ω читается точно так же, как ο"
examples:
  - greek: "Το τηλέφωνο χτυπάει."
    russian: "Телефон звонит."
    target: "τηλέφωνο"
