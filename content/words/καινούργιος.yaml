source: "Список слов к уроку 4.1; фонетика, примеры и иллюстрации подготовлены Lexi."
image: καινούργιος.svg
reading:
  - text: "Και"
    ipa: "ce"
    explanation: "αι читается как э, и κ перед ним смягчается"
  - text: "ού"
    ipa: "u"
    explanation: "ου читается как у"
  - text: "γιο"
    ipa: "ʝo"
    explanation: "γ перед ι с гласной — звонкий звук, близкий к й"
examples:
