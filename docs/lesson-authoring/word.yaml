# Шаблон слова: content/words/<греческое-имя>.yaml
# `id` стабилен и не меняется при переименовании файла; у нового слова его можно не указывать.
id: w-example
greek: το δείγμα
russian: образец
ipa: /to ˈðiɣma/
verified: false
note: Существительное среднего рода.
# Разбор чтения: сочетание из самого слова, его звучание и объяснение.
reading:
  - text: γμ
    ipa: ɣm
    explanation: γ перед μ — звонкий гортанный призвук
# `target` примера — строка, помечающая слово-цель в предложении.
# Это не то же самое, что `target` у задания с пропуском (см. cloze.yaml).
examples:
  - greek: Το δείγμα είναι απλό.
    russian: Образец простой.
    target: δείγμα
    source: Шаблон документации Lexi (пример формата)
